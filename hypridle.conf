general {
  # Use hyprlock for screen locking
  lock_cmd = hyprlock
  before_sleep_cmd = hyprlock
  after_sleep_cmd = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

# Lock the screen. Temporarily 10h (was 1200 = 20 min) so POL/FFXI updates
# aren't interrupted; put it back to 1200 when done babysitting installs.
listener {
  timeout = 36000
  on-timeout = hyprlock
  on-resume = hyprctl dispatch dpms on
}

# Turn displays off. Also 10h for the same reason (was 1200 = 20 min).
listener {
  timeout = 36000
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}
